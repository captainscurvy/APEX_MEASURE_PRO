<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Measure Pro</title>
<meta name="description" content="Laser measurement capture for window treatments.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/brand.css">
<link rel="stylesheet" href="./css/saas.css">
<link rel="stylesheet" href="./css/polish.css">
<script src="./js/boot-theme.js"></script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="appbar" id="appbar"></header>
<div id="banners" class="banners"></div>
<main id="view" class="view" tabindex="-1"></main>
<div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="print-root" class="print-root" data-theme="light"></div>
<dialog id="confirm" class="confirm">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="row-actions">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn btn-danger" value="ok" id="confirm-ok">Delete</button>
    </div>
  </form>
</dialog>
<noscript><p class="fatal">Apex Measure Pro needs JavaScript. Use a current version of Chrome or Edge.</p></noscript>
<script src="./js/boot.js"></script>
</body>
</html>
