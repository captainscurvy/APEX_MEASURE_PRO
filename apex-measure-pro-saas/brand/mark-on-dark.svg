<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Apex Measure Pro">
  <title>Apex Measure Pro</title>
  <defs>
    <linearGradient id="mL" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8C0CA"/></linearGradient>
    <linearGradient id="mR" x1="1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5F6B79"/><stop offset="1" stop-color="#1F2833"/></linearGradient>
    <radialGradient id="mG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#FF5A1F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/></radialGradient>
  </defs>
    <!-- facets: the peak, lit from the upper left -->
    <polygon points="14,100 64,20 64,60 40,100" fill="url(#mL)"/>
    <polygon points="64,20 114,100 88,100 64,60" fill="url(#mR)"/>
    <line x1="64" y1="21" x2="64" y2="59" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.8"/>
    <line x1="14.6" y1="99.6" x2="63.6" y2="21" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="0.9"/>
    <!-- the measurement: laser plumb from the apex onto the 1/8" scale -->
    <line x1="64" y1="66" x2="64" y2="112" stroke="#FF5A1F" stroke-width="1.6" stroke-dasharray="3 3"/>
    <g stroke="#AEB6C1" stroke-width="1.6" stroke-linecap="square">
      <line x1="14" y1="112" x2="114" y2="112"/><line x1="14.0" y1="112" x2="14.0" y2="121"/><line x1="26.5" y1="112" x2="26.5" y2="115"/><line x1="39.0" y1="112" x2="39.0" y2="117"/><line x1="51.5" y1="112" x2="51.5" y2="115"/><line x1="64.0" y1="112" x2="64.0" y2="119"/><line x1="76.5" y1="112" x2="76.5" y2="115"/><line x1="89.0" y1="112" x2="89.0" y2="117"/><line x1="101.5" y1="112" x2="101.5" y2="115"/><line x1="114.0" y1="112" x2="114.0" y2="121"/></g>
    <!-- the apex point -->
    <circle cx="64" cy="20" r="22" fill="url(#mG)"/>
    <circle cx="64" cy="20" r="4.2" fill="#FF5A1F"/>
    <circle cx="64" cy="20" r="1.8" fill="#FFE2D4"/>
</svg>
