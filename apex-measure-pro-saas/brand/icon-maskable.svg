<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Apex Measure Pro">
  <title>Apex Measure Pro</title>
  <defs>
    <linearGradient id="iL" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8C0CA"/></linearGradient>
    <linearGradient id="iR" x1="1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5F6B79"/><stop offset="1" stop-color="#1F2833"/></linearGradient>
    <radialGradient id="iG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#FF5A1F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/></radialGradient>
    <radialGradient id="bg" cx="0.5" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#1E2733"/><stop offset="0.55" stop-color="#141B24"/><stop offset="1" stop-color="#0B1016"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g stroke="#2A3542" stroke-opacity="0.35" stroke-width="1"><line x1="0" y1="0" x2="0" y2="1024"/><line x1="64" y1="0" x2="64" y2="1024"/><line x1="128" y1="0" x2="128" y2="1024"/><line x1="192" y1="0" x2="192" y2="1024"/><line x1="256" y1="0" x2="256" y2="1024"/><line x1="320" y1="0" x2="320" y2="1024"/><line x1="384" y1="0" x2="384" y2="1024"/><line x1="448" y1="0" x2="448" y2="1024"/><line x1="512" y1="0" x2="512" y2="1024"/><line x1="576" y1="0" x2="576" y2="1024"/><line x1="640" y1="0" x2="640" y2="1024"/><line x1="704" y1="0" x2="704" y2="1024"/><line x1="768" y1="0" x2="768" y2="1024"/><line x1="832" y1="0" x2="832" y2="1024"/><line x1="896" y1="0" x2="896" y2="1024"/><line x1="960" y1="0" x2="960" y2="1024"/><line x1="1024" y1="0" x2="1024" y2="1024"/><line x1="0" y1="0" x2="1024" y2="0"/><line x1="0" y1="64" x2="1024" y2="64"/><line x1="0" y1="128" x2="1024" y2="128"/><line x1="0" y1="192" x2="1024" y2="192"/><line x1="0" y1="256" x2="1024" y2="256"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="384" x2="1024" y2="384"/><line x1="0" y1="448" x2="1024" y2="448"/><line x1="0" y1="512" x2="1024" y2="512"/><line x1="0" y1="576" x2="1024" y2="576"/><line x1="0" y1="640" x2="1024" y2="640"/><line x1="0" y1="704" x2="1024" y2="704"/><line x1="0" y1="768" x2="1024" y2="768"/><line x1="0" y1="832" x2="1024" y2="832"/><line x1="0" y1="896" x2="1024" y2="896"/><line x1="0" y1="960" x2="1024" y2="960"/><line x1="0" y1="1024" x2="1024" y2="1024"/></g>
  <g transform="translate(252.0 267.6) scale(4.0625)">
    <!-- extrusion: the peak's solid back face -->
    <g fill="#04070A" transform="translate(2.4000000000000004 3)">
      <polygon points="14,100 64,20 64,60 40,100"/><polygon points="64,20 114,100 88,100 64,60"/></g>
    <polygon points="14,100 16.4,103 42.4,103 40,100" fill="#1A222C"/>
    <polygon points="88,100 90.4,103 116.4,103 114,100" fill="#0E141B"/>
    <!-- facets: the peak, lit from the upper left -->
