    <line x1="64" y1="66" x2="64" y2="112" stroke="#FF5A1F" stroke-width="1.6" stroke-dasharray="3 3"/>
    <g stroke="#AEB6C1" stroke-width="1.6" stroke-linecap="square">
      <line x1="14" y1="112" x2="114" y2="112"/><line x1="14.0" y1="112" x2="14.0" y2="121"/><line x1="26.5" y1="112" x2="26.5" y2="115"/><line x1="39.0" y1="112" x2="39.0" y2="117"/><line x1="51.5" y1="112" x2="51.5" y2="115"/><line x1="64.0" y1="112" x2="64.0" y2="119"/><line x1="76.5" y1="112" x2="76.5" y2="115"/><line x1="89.0" y1="112" x2="89.0" y2="117"/><line x1="101.5" y1="112" x2="101.5" y2="115"/><line x1="114.0" y1="112" x2="114.0" y2="121"/></g>
    <!-- the apex point -->
    <circle cx="64" cy="20" r="22" fill="url(#iG)"/>
    <circle cx="64" cy="20" r="4.2" fill="#FF5A1F"/>
    <circle cx="64" cy="20" r="1.8" fill="#FFE2D4"/></g>
