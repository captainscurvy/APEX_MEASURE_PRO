    <polygon points="64,20 114,100 88,100 64,60" fill="url(#iR)"/>
    <line x1="64" y1="21" x2="64" y2="59" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.8"/>
    <line x1="14.6" y1="99.6" x2="63.6" y2="21" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="0.9"/>
